
name: Veille documentaire Boussole 2027

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: write

jobs:
  collecter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collecter les publications et preparer la base
        run: python scripts/collecter.py

      - name: Enregistrer les changements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/queue.json data/status.json manifest.json boussole_2027_positions.json
          if ! git diff --cached --quiet; then
            git commit -m 'Veille automatique des sources politiques'
            git push
          fi                    
