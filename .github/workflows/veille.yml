name: Veille documentaire Boussole 2027

on:
  workflow_dispatch:
    inputs:
      indexer_scrutins_AN:
        description: 'Indexer les scrutins officiels AN (archive possiblement volumineuse)'
        type: boolean
        default: false
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: write
concurrency:
  group: veille-boussole
  cancel-in-progress: false

jobs:
  collecter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter les publications
        run: python scripts/collecter.py
      - name: Analyser les titres et extraits RSS
        run: python scripts/analyser_publications.py
      - name: Installer lecteur PDF
        run: python -m pip install 'pypdf>=5,<7'
      - name: Lire documents HTML et PDF (diagnostic V23)
        env:
          BOUSSOLE_MAX_DOCS: '18'
        run: python scripts/extraire_documents_v23.py
      - name: Générer les pages V19 à V21
        run: |
          python scripts/generer_analyse_html.py
          python scripts/generer_revue.py
          python scripts/generer_preuves_html.py
      - name: Compléter le diagnostic et indexer éventuellement les scrutins officiels
        env:
          BOUSSOLE_AN_VOTES: ${{ inputs.indexer_scrutins_AN == true && '1' || '0' }}
        run: |
          python scripts/enrichir_sources_v22.py
          python scripts/generer_diagnostic_v22.py
      - name: Publier les causes de refus V23
        run: python scripts/generer_diagnostic_v23.py
      - name: Contrôles du module de votes V24
        run: python -m unittest discover -s tests -p 'test_v24.py' -v
      - name: Indexer les scrutins nominatifs officiels AN
        run: python scripts/indexer_votes_v24.py
      - name: Vérifier les rapprochements V25
        run: python -m unittest discover -s tests -p 'test_v25.py' -v
      - name: Relier les acteurs officiels aux votes V24
        run: python scripts/rapprocher_votes_v25.py
      - name: Publier le bilan de couverture V29
        run: python scripts/suivi_couverture_v29.py
      - name: Tester la qualification documentaire V30
        run: python -m unittest discover -s tests -p 'test_v30.py' -v
      - name: Générer les signalements V30 (sans changement des positions)
        run: python scripts/qualifier_preuves_v30.py
      - name: Tester la vérification des preuves V31
        run: python -m unittest discover -s tests -p 'test_v31.py' -v
      - name: Vérifier les pages officielles des signaux V30 (sans attribution)
        run: python scripts/qualifier_preuves_v31.py
      - name: Contrôler la qualification documentaire V32
        run: python -m unittest discover -s tests -p 'test_v32.py' -v
      - name: Publier le registre documentaire V32 (sans nouveau codage)
        run: python scripts/qualifier_preuves_v32.py
      - name: Détecter et ajouter automatiquement les candidatures concordantes V27
        run: python scripts/candidatures_auto_v27.py
      - name: Enregistrer les résultats
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/ revue.html analyse.html preuves.html diagnostic.html diagnostic-v23.html votes.html votes-personnalites.html couverture.html candidatures.html propositions.html verification.html qualification.html boussole_2027_positions.json manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Veille V32 : qualification documentaire sans attribution automatique'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
