name: Veille documentaire Boussole 2027

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: write

concurrency:
  group: veille-boussole
  cancel-in-progress: false

jobs:
  collecter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter les publications
        run: python scripts/collecter.py
      - name: Analyser les titres et extraits RSS
        run: python scripts/analyser_publications.py
      - name: Extraire les passages des pages accessibles
        env:
          BOUSSOLE_MAX_PAGES: '12'
        run: python scripts/extraire_declarations.py
      - name: Generer les pages de consultation
        run: |
          python scripts/generer_analyse_html.py
          python scripts/generer_revue.py
          python scripts/generer_preuves_html.py
      - name: Enregistrer les resultats documentaires
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/queue.json data/status.json data/propositions_analyse.json data/propositions_analyse.csv data/registre_preuves_v20.json revue.html analyse.html preuves.html
          if ! git diff --cached --quiet; then
            git commit -m 'Veille : extraction des preuves potentielles V20'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
