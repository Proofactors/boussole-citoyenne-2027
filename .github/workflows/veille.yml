name: Veille documentaire Boussole 2027

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: write

concurrency:
  group: veille-boussole
  cancel-in-progress: false

jobs:
  collecter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter les publications
        run: python scripts/collecter.py
      - name: Analyser et trier les publications
        run: python scripts/analyser_publications.py
      - name: Publier le tableau d’analyse
        run: python scripts/generer_analyse_html.py
      - name: Generer le tableau de veille
        run: python scripts/generer_revue.py
      - name: Enregistrer le suivi et les propositions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/queue.json data/status.json data/propositions_analyse.json data/propositions_analyse.csv revue.html analyse.html
          if ! git diff --cached --quiet; then
            git commit -m 'Analyse automatique des publications de veille'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
